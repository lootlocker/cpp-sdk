name: build

# Tier 1 and tier 2 from D14: unit tests and a compile-and-smoke consumer on every
# target. Tier 3 (the full feature suite against the real API) is a separate workflow and
# runs on one target only.
#
# This workflow is also T3 — the toolchain matrix probe. Its first green run on
# Windows/MSVC, Linux/GCC and macOS/Clang is the evidence that the C++17 floor (D1)
# actually compiles on the toolchains we intend to claim.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows / MSVC
            os: windows-latest
          - name: Linux / GCC
            os: ubuntu-latest
          - name: macOS / Clang
            os: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # libcurl is the default transport (D3). Installing it means the curl path is
      # actually compiled and exercised on every target, rather than being dead code that
      # only a downstream adopter discovers is broken.
      - name: Install libcurl
        shell: bash
        run: |
          set -e
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install curl
          else
            # windows-latest ships curl headers and libs with the runner image.
            echo "using the runner-provided curl"
          fi

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # Tier 1 and tier 2 together: the unit suites and the consumer smoke test are both
      # registered with ctest, so this runs the consumer binary rather than only building
      # it. A compile-only check would pass even if the program crashed on startup.
      - name: Tier 1 + tier 2 — tests and smoke
        run: ctest --test-dir build --build-config Release --output-on-failure

  # T8c: every module compiles on its own, so a module that quietly gains a dependency on
  # another module fails here rather than at a consumer's link step (D17).
  #
  # Configuring the whole project and building one target does NOT prove isolation: CMake
  # resolves the target's link dependencies, so if auth started linking broadcasts,
  # building auth would build broadcasts too and this job would still pass. Each module is
  # therefore configured in a project where the other feature targets are never declared.
  module-boundary:
    name: Module boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The transport is part of core, so this job needs curl too - otherwise it would
      # silently build a core without the default transport and prove less than it claims.
      - name: Install libcurl
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Each module builds alone
        run: |
          set -e
          for module in auth broadcasts; do
            echo "::group::$module, with no other feature module declared"
            cmake -S . -B "build-$module" -DCMAKE_BUILD_TYPE=Release \
                  -DLOOTLOCKER_BUILD_TESTS=OFF -DLOOTLOCKER_BUILD_EXAMPLES=OFF \
                  -DLOOTLOCKER_MODULE_ONLY="$module"
            cmake --build "build-$module" --target "lootlocker_$module" --parallel
            echo "::endgroup::"
          done

      - name: Core builds alone
        run: |
          set -e
          cmake -S . -B build-core -DCMAKE_BUILD_TYPE=Release \
                -DLOOTLOCKER_BUILD_TESTS=OFF -DLOOTLOCKER_BUILD_EXAMPLES=OFF \
                -DLOOTLOCKER_MODULE_ONLY=core
          cmake --build build-core --target lootlocker_core --parallel

      # The option takes a list, so a subset of modules must work too. This is the shape a
      # game actually uses: it names the modules it wants, not one and not all.
      - name: A subset of modules builds
        run: |
          set -e
          cmake -S . -B build-subset -DCMAKE_BUILD_TYPE=Release \
                -DLOOTLOCKER_BUILD_TESTS=OFF -DLOOTLOCKER_BUILD_EXAMPLES=OFF \
                "-DLOOTLOCKER_MODULE_ONLY=auth;broadcasts"
          cmake --build build-subset --target lootlocker_auth lootlocker_broadcasts --parallel

      # A typo must fail loudly. It used to configure cleanly and declare no feature
      # targets at all, which reads as "the SDK is broken" rather than "the name is wrong".
      - name: An unknown module name fails the configure
        run: |
          set -e
          if cmake -S . -B build-typo -DCMAKE_BUILD_TYPE=Release \
                   -DLOOTLOCKER_BUILD_TESTS=OFF -DLOOTLOCKER_BUILD_EXAMPLES=OFF \
                   -DLOOTLOCKER_MODULE_ONLY=autth 2>&1; then
            echo "::error::An unknown module name configured successfully; it must fail."
            exit 1
          fi
          echo "an unknown module name fails the configure, as intended"

  # T8b: nothing under include/ may reach into src/. The include path is the boundary
  # (D18), so a public header that includes a private one breaks the contract even though
  # it compiles in-tree.
  include-boundary:
    name: Include boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: No public header includes a private one
        run: |
          set -e
          # POSIX ERE, so this is the same engine as `git grep -E` and GNU `grep -E`.
          #
          # Two shapes are rejected:
          #   1. a path into a private directory: core/, internal/, detail/, src/
          #   2. a relative escape out of include/: "../src/..."
          # The second matters because a header can reach src/ without naming it.
          if grep -rn --include='*.h' --include='*.hpp' \
               -E '#include[[:space:]]*[<"](lootlocker/)?(core|internal|detail|src)/|#include[[:space:]]*[<"][.][.]/' \
               include/; then
            echo "::error::A public header includes a private header. See D18."
            exit 1
          fi
          echo "include/ is clean"

      - name: No public header includes the JSON library
        run: |
          set -e
          # D4: the JSON library lives behind a pimpl. A public header that includes it
          # would make our parser choice part of the API and undo the pimpl in one line.
          if grep -rn --include='*.h' --include='*.hpp' \
               -E '#include[[:space:]]*[<"](nlohmann|rapidjson)' \
               include/; then
            echo "::error::A public header includes the JSON library. See D4."
            exit 1
          fi
          echo "no public header includes the JSON library"

  # The timezone table is generated from data/windows-to-iana.tsv (D26). A hand-edited
  # generated file would drift from its source, so regenerating must produce no diff.
  generated-files:
    name: Generated files are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Regenerating produces no diff
        run: |
          set -e
          python3 tools/generate_timezone_table.py
          # Scoped to the generated file. A submodule checkout can leave the submodule
          # dirty, and an unscoped `git diff` would then fail this job for a reason that
          # has nothing to do with generated files.
          if ! git diff --quiet -- src/core/timezone_table.inc; then
            echo "::error::src/core/timezone_table.inc is out of date. Run tools/generate_timezone_table.py and commit the result."
            git --no-pager diff -- src/core/timezone_table.inc
            exit 1
          fi
          echo "generated files are current"

      # The same regeneration through CMake, which is the path packaging uses. This proves
      # the option works rather than only that the script does.
      #
      # The table is deliberately corrupted first. Because it is checked in, any
      # OUTPUT-based rule is already satisfied and the build would report "no work to do"
      # without running Python - so a step that only rebuilds an intact tree tests nothing.
      # Corrupting it is the only way to prove the generator actually runs and repairs it.
      - name: The CMake regeneration option repairs a stale table
        run: |
          set -e
          cmake -S . -B build-gen -DCMAKE_BUILD_TYPE=Release \
                -DLOOTLOCKER_BUILD_TESTS=OFF -DLOOTLOCKER_BUILD_EXAMPLES=OFF \
                -DLOOTLOCKER_REGENERATE_TIMEZONE=ON
          # Corrupt the table rather than deleting it: deleting proves only that the
          # target can create a missing file, whereas corrupting proves it repairs a
          # stale one - which is the case that a checked-in file actually hits.
          echo '/* corrupted by CI to prove regeneration runs */' >> src/core/timezone_table.inc
          cmake --build build-gen --target lootlocker_generate_timezone
          if grep -q 'corrupted by CI' src/core/timezone_table.inc; then
            echo "::error::The CMake regeneration did not run; the corrupted table survived."
            exit 1
          fi
          if ! git diff --quiet -- src/core/timezone_table.inc; then
            echo "::error::The CMake regeneration produced a different table than the committed one."
            git --no-pager diff -- src/core/timezone_table.inc
            exit 1
          fi
          echo "the CMake regeneration option regenerates and repairs the table"
